[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "placepulse-cusp"
version = "0.1.0"
description = "Distribution-preserving Place Pulse analysis with Davidson, heterogeneous preference, mixture, and stochastic CUSP models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "polars>=1.20,<2",
  "pyarrow>=17,<22",
  "torch>=2.4,<3",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
  "diptest>=0.9,<1",
  "kagglehub[pandas-datasets]>=0.3,<1",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
ppc = "placepulse_cusp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/placepulse_cusp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
