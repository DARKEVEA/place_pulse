[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "placepulse-cusp"
version = "0.1.0"
description = "Distribution-preserving Place Pulse analysis with Davidson, heterogeneous preference, mixture, and stochastic CUSP models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
ppc = "placepulse_cusp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/placepulse_cusp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
